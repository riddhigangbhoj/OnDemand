name: Deploy prototypes to GitHub Pages

# Publishes ALL prototypes to the `gh-pages` branch (one Pages site):
#   /OnDemand/            -> vanilla prototype (index.html, script.js, styles.css)
#   /OnDemand/trainer.html-> trainer prototype
#   /OnDemand/app/#/      -> React customer app (ondemand-app)
# Runs from the `add-customer-app` branch — no merge to main required.
on:
  push:
    branches: [add-customer-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ondemand-app/package-lock.json

      - name: Install dependencies
        working-directory: ondemand-app
        run: npm ci

      - name: Build customer app
        working-directory: ondemand-app
        run: npm run build

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/app
          # vanilla + trainer prototypes at the root (unchanged live URLs)
          cp index.html script.js styles.css trainer.css trainer.html _site/
          [ -d docs ] && cp -r docs _site/ || true
          # React customer app under /app/
          cp -r ondemand-app/dist/. _site/app/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
